<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Adventure Account - CUET AS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkForest: '#050b08',
                        moss: '#0a1c13',
                        trail: '#2d6a4f',
                        campfire: '#e76f51',
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(231, 111, 81, 0.4)',
                        'glow-sm': '0 0 10px rgba(231, 111, 81, 0.2)',
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050b08; }
        ::-webkit-scrollbar-thumb { background: #2d6a4f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e76f51; }

        /* Dark Glass Input Styles */
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3f4f6; /* gray-100 */
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }
        .glass-input:focus {
            background: rgba(10, 28, 19, 0.8);
            border-color: #e76f51;
            box-shadow: 0 0 15px rgba(231, 111, 81, 0.3);
            transform: translateY(-3px) scale(1.01);
        }
        
        /* Select Dropdown Dark Styling */
        select.glass-input option {
            background-color: #0a1c13;
            color: #f3f4f6;
        }

        .glass-panel {
            background: rgba(10, 28, 19, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Auto-fill dark fix */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0a1c13 inset !important;
            -webkit-text-fill-color: white !important;
        }
    </style>
</head>

<body class="bg-darkForest text-gray-300 font-sans antialiased min-h-screen flex md:items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-x-hidden selection:bg-campfire selection:text-white">

    <!-- Thematic Background -->
    <div class="absolute inset-0 z-0">
        <!-- Background Image (Campfire/Dark woods) -->
        <img src="https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&q=80&w=1920" alt="Dark Campfire" class="w-full h-full object-cover opacity-30 filter brightness-50 contrast-125">
        <div class="absolute inset-0 bg-gradient-to-br from-darkForest/90 via-moss/80 to-darkForest/90"></div>
        
        <!-- Glowing Orbs representing fireflies/embers -->
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-campfire/10 rounded-full mix-blend-screen filter blur-[100px] animate-[pulse_4s_ease-in-out_infinite]"></div>
        <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-trail/10 rounded-full mix-blend-screen filter blur-[80px] animate-[pulse_6s_ease-in-out_infinite]"></div>
    </div>

    <!-- Main Container -->
    <div class="max-w-6xl w-full glass-panel rounded-[2rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative z-10 border border-white/10" data-aos="zoom-in" data-aos-duration="1000">
        
        <!-- Left Side: Hero / Vibe -->
        <div class="w-full md:w-5/12 bg-black/40 text-white flex flex-col justify-between relative overflow-hidden group p-10 lg:p-14">
            
            <div class="relative z-10 flex flex-col h-full justify-between">
                <div data-aos="fade-right" data-aos-delay="200">
                    <a href="index.html" class="inline-flex items-center gap-2 text-gray-400 mb-12 hover:text-campfire transition-colors backdrop-blur-sm bg-white/5 px-4 py-2 rounded-full text-xs font-bold tracking-widest uppercase border border-white/10 hover:border-campfire/50 hover:bg-campfire/10">
                        <i class="fa-solid fa-arrow-left"></i> জঙ্গলে ফিরে যান
                    </a>
                    
                    <div class="mb-8 transform transition-transform duration-700 hover:rotate-12">
                        <i class="fa-solid fa-fire-flame-curved text-6xl text-campfire drop-shadow-[0_0_15px_rgba(231,111,81,0.8)] animate-pulse"></i>
                    </div>
                    
                    <h2 class="text-4xl lg:text-5xl font-black leading-tight mb-5 tracking-tight text-white drop-shadow-lg">
                        অজানার পথে <br><span class="text-campfire">প্রথম পা</span>
                    </h2>
                    <p class="text-gray-400 text-sm sm:text-base leading-relaxed border-l-2 border-campfire pl-4">
                        একটি প্রোফাইল, অসংখ্য ট্রেইল। ক্লাবের ইভেন্ট বুকিং, ট্রেইল হিস্ট্রি এবং সেফটি ইনডেক্স ম্যানেজ করতে আজই আপনার অ্যাডভেঞ্চার আইডি তৈরি করুন।
                    </p>
                </div>
            </div>
        </div>

        <!-- Right Side: The Form -->
        <div class="w-full md:w-7/12 p-8 sm:p-12 lg:p-16 relative">
            
            <!-- Header -->
            <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5 mb-10 text-center sm:text-left" data-aos="fade-down" data-aos-delay="300">
                <div class="p-4 bg-white/5 rounded-2xl border border-white/10 shadow-sm backdrop-blur-md text-campfire text-3xl">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="mt-1">
                    <h3 class="text-2xl lg:text-3xl font-black text-white mb-1 tracking-tight">পরিচয়পত্র তৈরি করুন</h3>
                    <p class="text-sm text-gray-400 font-medium">ক্যাম্পফায়ারে যুক্ত হতে গুগলের মাধ্যমে সাইন-আপ করুন।</p>
                </div>
            </div>

            <!-- Google Login (Dark Mode) -->
            <div data-aos="fade-up" data-aos-delay="400">
                <button id="google-login-btn" type="button" class="w-full flex items-center justify-center gap-3 bg-white/5 border border-white/10 text-gray-200 hover:bg-white/10 hover:border-campfire/50 hover:shadow-glow-sm font-bold py-3.5 px-4 rounded-xl transition-all mb-6 relative overflow-hidden group backdrop-blur-sm">
                    <svg class="w-5 h-5 relative z-10" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.58c2.08-1.92 3.27-4.74 3.27-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.58-2.77c-.98.66-2.23 1.06-3.7 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span class="relative z-10">গুগল দিয়ে কন্টিনিউ করুন</span>
                </button>
            </div>

            <div class="relative flex items-center py-4 mb-6" data-aos="fade-up" data-aos-delay="450">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="flex-shrink-0 mx-4 text-gray-500 text-[10px] sm:text-xs font-bold tracking-widest uppercase bg-transparent px-2">অথবা ম্যানুয়ালি লিখুন</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <!-- Manual Form -->
            <form id="signup-form" class="space-y-5">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div data-aos="fade-up" data-aos-delay="500">
                        <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">আপনার নাম *</label>
                        <input type="text" id="fullName" required placeholder="Full Name" class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                    <div data-aos="fade-up" data-aos-delay="550">
                        <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">স্টুডেন্ট আইডি *</label>
                        <input type="text" id="studentId" required placeholder="e.g. 2101001" class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                </div>

                <div data-aos="fade-up" data-aos-delay="600">
                    <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">ইমেইল অ্যাড্রেস *</label>
                    <input type="email" id="email" required placeholder="example@cuet.ac.bd" class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div data-aos="fade-up" data-aos-delay="650">
                        <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">আবাসিক হল *</label>
                        <select id="hall" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none appearance-none cursor-pointer">
                            <option value="" disabled selected>নির্বাচন করুন</option>
                            <option value="Muktijoddha Hall">Muktijoddha Hall</option>
                            <option value="Shahid Mohammad Shah Hall">Shahid Mohammad Shah Hall</option>
                            <option value="Dr. Qudrat-E-Khuda Hall">Dr. Qudrat-E-Khuda Hall</option>
                            <option value="Kabi Kazi Nazrul Islam Hall">Kabi Kazi Nazrul Islam Hall</option>
                            <option value="Shaheed Tareq Huda Hall">Shaheed Tareq Huda Hall</option>
                            <option value="Shaheed Abu Sayed Hall">Shaheed Abu Sayed Hall</option>
                            <option value="Sufia kamal Hall">Sufia kamal Hall</option>
                            <option value="Begum Shamsennahar Khan Hall">Begum Shamsennahar Khan Hall</option>
                            <option value="Tapashi Rabeya Hall">Tapashi Rabeya Hall</option>
                            <option value="Attached/Non-residential">অ্যাটাচড/অনাবাসিক</option>
                        </select>
                    </div>
                    <div data-aos="fade-up" data-aos-delay="700">
                        <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">রক্তের গ্রুপ *</label>
                        <select id="bloodGroup" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none appearance-none cursor-pointer">
                            <option value="" disabled selected>নির্বাচন করুন</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div data-aos="fade-up" data-aos-delay="750">
                        <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">নিজের ফোন নম্বর *</label>
                        <input type="tel" id="phone" required placeholder="01XXXXXXXXX" class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                    <div data-aos="fade-up" data-aos-delay="800">
                        <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">জরুরি কন্টাক্ট (পরিবার) *</label>
                        <input type="tel" id="emergencyContact" required placeholder="01XXXXXXXXX" class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div data-aos="fade-up" data-aos-delay="850">
                        <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">পাসওয়ার্ড *</label>
                        <input type="password" id="password" required placeholder="••••••••" class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                    <div data-aos="fade-up" data-aos-delay="900">
                        <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">পুনরায় পাসওয়ার্ড দিন *</label>
                        <input type="password" id="confirmPassword" required placeholder="••••••••" class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                </div>

                <div data-aos="fade-up" data-aos-delay="950">
                    <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">টি-শার্ট সাইজ *</label>
                    <select id="tshirtSize" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none appearance-none cursor-pointer">
                        <option value="" disabled selected>নির্বাচন করুন</option>
                        <option value="S">S (Small)</option>
                        <option value="M">M (Medium)</option>
                        <option value="L">L (Large)</option>
                        <option value="XL">XL (Extra Large)</option>
                        <option value="XXL">XXL (Double XL)</option>
                    </select>
                </div>

                <div class="pt-6" data-aos="zoom-in" data-aos-delay="1000">
                    <button type="submit" id="submit-btn" class="w-full bg-campfire hover:bg-orange-600 text-white font-black text-lg py-4 px-4 rounded-xl transition-all shadow-glow hover:shadow-[0_0_30px_rgba(231,111,81,0.6)] hover:-translate-y-1 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-compass"></i> অ্যাডভেঞ্চার অ্যাকাউন্ট তৈরি করুন
                    </button>
                </div>
            </form>
            
        </div>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS (AOS & FIREBASE)                   -->
    <!-- ========================================== -->
    
    <!-- AOS Animation Engine -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            once: true,
            offset: 50,
        });
    </script>

    <!-- Firebase Core Libraries (DO NOT CHANGE) -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <script>
        // -----------------------------------------
        // Firebase Configuration & Logic
        // -----------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyDX3usovY7xlO4wY8GfJ3bk6pnRClGf1Ag",
            authDomain: "cuet-as.firebaseapp.com",
            projectId: "cuet-as",
            storageBucket: "cuet-as.firebasestorage.app",
            messagingSenderId: "869959746091",
            appId: "1:869959746091:web:fa2c086441fc429a14606e",
            measurementId: "G-WNJBJT9K5K"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 1. Google Login Logic
        const googleBtn = document.getElementById('google-login-btn');
        const provider = new firebase.auth.GoogleAuthProvider();

        googleBtn.addEventListener('click', () => {
            googleBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Connecting...';
            auth.signInWithPopup(provider)
                .then((result) => { window.location.href = "dashboard.html"; })
                .catch((error) => {
                    alert("লগইন করা যায়নি: " + error.message);
                    googleBtn.innerHTML = 'গুগল দিয়ে কন্টিনিউ করুন';
                });
        });

        // 2. Manual Form Submission Logic
        const signupForm = document.getElementById('signup-form');
        const submitBtn = document.getElementById('submit-btn');

        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const studentId = document.getElementById('studentId').value;
            const email = document.getElementById('email').value;
            const hall = document.getElementById('hall').value;
            const bloodGroup = document.getElementById('bloodGroup').value;
            const phone = document.getElementById('phone').value;
            const emergencyContact = document.getElementById('emergencyContact').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const tshirtSize = document.getElementById('tshirtSize').value;

            if (password !== confirmPassword) {
                alert("পাসওয়ার্ড দুটি মিলছে না! দয়া করে আবার চেক করুন।");
                return;
            }

            if (password.length < 6) {
                alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।");
                return;
            }

            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> অ্যাকাউন্ট তৈরি হচ্ছে...';
            submitBtn.disabled = true;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // Saving data to Firestore perfectly
                    return db.collection("users").doc(user.uid).set({
                        fullName: fullName,
                        studentId: studentId,
                        email: email,
                        hall: hall,
                        bloodGroup: bloodGroup,
                        phone: phone,
                        emergencyContact: emergencyContact,
                        tshirtSize: tshirtSize,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    alert("অভিনন্দন! আপনার অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে।");
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("সমস্যা হয়েছে: " + error.message);
                    submitBtn.innerHTML = '<i class="fa-solid fa-compass"></i> অ্যাডভেঞ্চার অ্যাকাউন্ট তৈরি করুন';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
