<!DOCTYPE html>
<html lang="bn" class="scroll-smooth" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CUET AS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    colors: {
                        darkForest: '#050b08',
                        moss: '#0a1c13',
                        trail: '#2d6a4f',
                        campfire: '#e76f51',
                        mistBg: '#e2e8f0', 
                        mistPanel: '#f8fafc',
                        mistText: '#1e293b'
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(231, 111, 81, 0.4)',
                        'glow-sm': '0 0 10px rgba(231, 111, 81, 0.2)',
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--scroll-bg, #050b08); }
        ::-webkit-scrollbar-thumb { background: #2d6a4f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e76f51; }

        .glass-panel {
            background: rgba(10, 28, 19, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3f4f6; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }
        .glass-input:focus {
            background: rgba(10, 28, 19, 0.8);
            border-color: #e76f51;
            box-shadow: 0 0 15px rgba(231, 111, 81, 0.3);
            transform: translateY(-3px) scale(1.01);
        }
        select.glass-input option { background-color: #0a1c13; color: #f3f4f6; }

        .light-mode .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(0, 0, 0, 0.1);
            color: #1e293b;
        }
        .light-mode .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #e76f51;
            box-shadow: 0 0 15px rgba(231, 111, 81, 0.2);
        }
        .light-mode select.glass-input option { background-color: #f8fafc; color: #1e293b; }
        .light-mode .bg-black\/50 { background-color: rgba(0,0,0,0.05); }

        .toggle-checkbox:checked { right: 0; border-color: #e76f51; }
        .toggle-checkbox:checked + .toggle-label { background-color: #e76f51; }
    </style>
</head>

<body class="bg-darkForest text-gray-300 dark:bg-darkForest dark:text-gray-300 font-sans antialiased min-h-screen flex md:items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-x-hidden transition-colors duration-500 selection:bg-campfire selection:text-white" id="body-content">

    <!-- DYNAMIC BACKGROUND (PARALLAX) -->
    <div class="fixed inset-0 z-0 pointer-events-none transition-opacity duration-1000">
        <img id="bg-dark-img" src="https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&q=80&w=1920" alt="Dark Campfire" class="absolute w-full h-full object-cover opacity-20 filter brightness-50 contrast-125 transition-opacity duration-1000">
        <div id="bg-dark-overlay" class="absolute inset-0 bg-gradient-to-br from-darkForest/90 via-moss/80 to-darkForest/90 transition-opacity duration-1000"></div>

        <img id="bg-light-img" src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&q=80&w=1920" alt="Misty Forest" class="absolute w-full h-full object-cover opacity-0 scale-105 filter transition-opacity duration-1000">
        <div id="bg-light-overlay" class="absolute inset-0 bg-gradient-to-br from-white/40 via-white/80 to-mistBg/95 opacity-0 transition-opacity duration-1000"></div>
        
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-trail/10 rounded-full mix-blend-screen filter blur-[100px] animate-[pulse_6s_ease-in-out_infinite]"></div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="max-w-4xl w-full glass-panel rounded-[2rem] shadow-2xl overflow-hidden flex flex-col relative z-10" data-aos="zoom-in" data-aos-duration="800">
        
        <div class="p-8 sm:p-10 border-b border-white/10 light-mode:border-gray-300 flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center bg-black/20 light-mode:bg-white/40">
            <div>
                <h2 class="text-2xl sm:text-3xl font-black text-white light-mode:text-mistText tracking-tight flex items-center gap-3">
                    <i class="fa-solid fa-user-pen text-campfire"></i> <span data-i18n="edit_title">প্রোফাইল এডিট</span>
                </h2>
                <p class="text-sm text-gray-400 light-mode:text-gray-600 mt-1" data-i18n="edit_subtitle">আপনার প্রয়োজনীয় তথ্য আপডেট করুন</p>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button onclick="openSettingsModal()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-2 bg-white/5 light-mode:bg-white/50 hover:bg-white/10 light-mode:hover:bg-gray-100 text-gray-300 light-mode:text-gray-700 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors border border-white/10 light-mode:border-gray-300">
                    <i class="fa-solid fa-gear text-blue-400"></i> <span data-i18n="nav_settings">সেটিংস</span>
                </button>
                <a href="dashboard.html" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-2 bg-white/5 light-mode:bg-white/50 hover:bg-white/10 light-mode:hover:bg-gray-100 text-gray-300 light-mode:text-gray-700 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors border border-white/10 light-mode:border-gray-300">
                    <i class="fa-solid fa-arrow-left"></i> <span data-i18n="edit_back">ড্যাশবোর্ড</span>
                </a>
            </div>
        </div>

        <div class="p-8 sm:p-10">
            <form id="edit-profile-form" class="space-y-6">
                
                <div class="flex items-center gap-6 mb-8 p-6 bg-white/5 light-mode:bg-white/50 rounded-2xl border border-white/5 light-mode:border-gray-200" data-aos="fade-up" data-aos-delay="100">
                    <div class="relative w-24 h-24 rounded-full overflow-hidden border-2 border-campfire shadow-glow group shrink-0">
                        <img id="preview-img" src="https://ui-avatars.com/api/?name=U&background=0a1c13&color=fff" alt="Profile" class="w-full h-full object-cover">
                        <label for="profilePic" class="absolute inset-0 bg-black/60 flex items-center justify-center cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-camera text-white text-xl"></i>
                        </label>
                        <input type="file" id="profilePic" accept="image/*" class="hidden">
                    </div>
                    <div>
                        <p class="text-sm font-bold text-white light-mode:text-black mb-1" data-i18n="edit_avatar_title">অ্যাভাটার আপডেট</p>
                        <p class="text-xs text-gray-400 light-mode:text-gray-600 mb-2" data-i18n="edit_avatar_desc">ক্যামেরা আইকনে ক্লিক করে নতুন ছবি দিন</p>
                        <label for="profilePic" class="text-xs font-bold text-campfire cursor-pointer hover:underline" data-i18n="edit_avatar_btn">ছবি আপলোড করুন</label>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div data-aos="fade-up" data-aos-delay="150">
                        <label class="block text-[11px] font-bold text-gray-400 light-mode:text-gray-500 mb-1.5 uppercase tracking-wider" data-i18n="lbl_name">আপনার নাম *</label>
                        <input type="text" id="fullName" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                    <div data-aos="fade-up" data-aos-delay="200">
                        <label class="block text-[11px] font-bold text-gray-400 light-mode:text-gray-500 mb-1.5 uppercase tracking-wider" data-i18n="lbl_id">স্টুডেন্ট আইডি *</label>
                        <input type="text" id="studentId" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                </div>

                <div data-aos="fade-up" data-aos-delay="250">
                    <label class="block text-[11px] font-bold text-gray-400 light-mode:text-gray-500 mb-1.5 uppercase tracking-wider" data-i18n="lbl_email">ইমেইল অ্যাড্রেস (পরিবর্তনযোগ্য নয়)</label>
                    <input type="email" id="email" readonly class="glass-input bg-black/50 w-full text-sm rounded-xl block p-3.5 outline-none opacity-60 cursor-not-allowed">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div data-aos="fade-up" data-aos-delay="300">
                        <label class="block text-[11px] font-bold text-gray-400 light-mode:text-gray-500 mb-1.5 uppercase tracking-wider" data-i18n="lbl_hall">আবাসিক হল *</label>
                        <select id="hall" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none appearance-none cursor-pointer">
                            <option value="Muktijoddha Hall">Muktijoddha Hall</option>
                            <option value="Shahid Mohammad Shah Hall">Shahid Mohammad Shah Hall</option>
                            <option value="Dr. Qudrat-E-Khuda Hall">Dr. Qudrat-E-Khuda Hall</option>
                            <option value="Kabi Kazi Nazrul Islam Hall">Kabi Kazi Nazrul Islam Hall</option>
                            <option value="Shaheed Tareq Huda Hall">Shaheed Tareq Huda Hall</option>
                            <option value="Shaheed Abu Sayed Hall">Shaheed Abu Sayed Hall</option>
                            <option value="Sufia kamal Hall">Sufia kamal Hall</option>
                            <option value="Begum Shamsennahar Khan Hall">Begum Shamsennahar Khan Hall</option>
                            <option value="Tapashi Rabeya Hall">Tapashi Rabeya Hall</option>
                            <option value="Attached/Non-residential" data-i18n="opt_attached">অ্যাটাচড/অনাবাসিক</option>
                        </select>
                    </div>
                    <div data-aos="fade-up" data-aos-delay="350">
                        <label class="block text-[11px] font-bold text-gray-400 light-mode:text-gray-500 mb-1.5 uppercase tracking-wider" data-i18n="lbl_blood">রক্তের গ্রুপ *</label>
                        <select id="bloodGroup" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none appearance-none cursor-pointer">
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div data-aos="fade-up" data-aos-delay="400">
                        <label class="block text-[11px] font-bold text-gray-400 light-mode:text-gray-500 mb-1.5 uppercase tracking-wider" data-i18n="lbl_phone">নিজের ফোন নম্বর *</label>
                        <input type="tel" id="phone" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                    <div data-aos="fade-up" data-aos-delay="450">
                        <label class="block text-[11px] font-bold text-gray-400 light-mode:text-gray-500 mb-1.5 uppercase tracking-wider" data-i18n="lbl_emergency">জরুরি কন্টাক্ট (পরিবার) *</label>
                        <input type="tel" id="emergencyContact" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>
                </div>

                <div data-aos="fade-up" data-aos-delay="500">
                    <label class="block text-[11px] font-bold text-gray-400 light-mode:text-gray-500 mb-1.5 uppercase tracking-wider" data-i18n="lbl_tshirt">টি-শার্ট সাইজ *</label>
                    <select id="tshirtSize" required class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none appearance-none cursor-pointer">
                        <option value="S">S (Small)</option>
                        <option value="M">M (Medium)</option>
                        <option value="L">L (Large)</option>
                        <option value="XL">XL (Extra Large)</option>
                        <option value="XXL">XXL (Double XL)</option>
                    </select>
                </div>

                <div class="pt-6" data-aos="zoom-in" data-aos-delay="600">
                    <button type="submit" id="submit-btn" class="w-full bg-trail hover:bg-mountain text-white font-black text-lg py-4 px-4 rounded-xl transition-all shadow-glow hover:-translate-y-1 flex justify-center items-center gap-2">
                        <i id="submit-icon" class="fa-solid fa-cloud-arrow-up"></i> <span id="submit-text" data-i18n="btn_save">পরিবর্তন সেভ করুন</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity" onclick="closeSettingsModal()"></div>
        
        <div class="bg-moss light-mode:bg-white border border-white/10 light-mode:border-gray-200 rounded-3xl p-8 max-w-sm w-full mx-4 relative z-10 shadow-2xl transform scale-95 transition-transform duration-300" id="settings-content">
            
            <div class="flex justify-between items-center mb-6 border-b border-white/10 light-mode:border-gray-200 pb-4">
                <h3 class="text-xl font-black text-white light-mode:text-black flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-campfire"></i> <span data-i18n="modal_settings">সেটিংস</span>
                </h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-white light-mode:hover:text-black transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="space-y-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="font-bold text-white light-mode:text-black text-sm" data-i18n="modal_theme">থিম (Theme)</p>
                        <p class="text-xs text-gray-500" data-i18n="modal_theme_desc">ডার্ক ফরেস্ট বা মিস্ট মোড</p>
                    </div>
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" id="theme-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-300"/>
                        <label for="theme-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"></label>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div>
                        <p class="font-bold text-white light-mode:text-black text-sm" data-i18n="modal_lang">ভাষা (Language)</p>
                        <p class="text-xs text-gray-500" data-i18n="modal_lang_desc">বাংলা অথবা English</p>
                    </div>
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" id="lang-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-300"/>
                        <label for="lang-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-blue-500 cursor-pointer"></label>
                    </div>
                </div>
            </div>

            <div class="mt-8">
                <button onclick="closeSettingsModal()" class="w-full bg-white/5 light-mode:bg-gray-100 hover:bg-white/10 light-mode:hover:bg-gray-200 border border-white/10 light-mode:border-gray-300 text-white light-mode:text-black font-bold py-3 rounded-xl transition-all" data-i18n="modal_done">
                    সম্পন্ন
                </button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script> AOS.init({ once: true, offset: 50 }); </script>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <script>
        const translations = {
            "nav_settings": { bn: "সেটিংস", en: "Settings" },
            "edit_title": { bn: "প্রোফাইল এডিট", en: "Edit Profile" },
            "edit_subtitle": { bn: "আপনার প্রয়োজনীয় তথ্য আপডেট করুন", en: "Update your necessary information" },
            "edit_back": { bn: "ড্যাশবোর্ড", en: "Dashboard" },
            "edit_avatar_title": { bn: "অ্যাভাটার আপডেট", en: "Update Avatar" },
            "edit_avatar_desc": { bn: "ক্যামেরা আইকনে ক্লিক করে নতুন ছবি দিন", en: "Click the camera icon to set a new photo" },
            "edit_avatar_btn": { bn: "ছবি আপলোড করুন", en: "Upload Photo" },
            "lbl_name": { bn: "আপনার নাম *", en: "Full Name *" },
            "lbl_id": { bn: "স্টুডেন্ট আইডি *", en: "Student ID *" },
            "lbl_email": { bn: "ইমেইল অ্যাড্রেস (পরিবর্তনযোগ্য নয়)", en: "Email Address (Non-changeable)" },
            "lbl_hall": { bn: "আবাসিক হল *", en: "Residential Hall *" },
            "lbl_blood": { bn: "রক্তের গ্রুপ *", en: "Blood Group *" },
            "lbl_phone": { bn: "নিজের ফোন নম্বর *", en: "Personal Phone *" },
            "lbl_emergency": { bn: "জরুরি কন্টাক্ট (পরিবার) *", en: "Emergency Contact (Family) *" },
            "lbl_tshirt": { bn: "টি-শার্ট সাইজ *", en: "T-Shirt Size *" },
            "opt_attached": { bn: "অ্যাটাচড/অনাবাসিক", en: "Attached/Non-residential" },
            "btn_save": { bn: "পরিবর্তন সেভ করুন", en: "Save Changes" },
            "modal_settings": { bn: "সেটিংস", en: "Settings" },
            "modal_theme": { bn: "থিম (Theme)", en: "Theme" },
            "modal_theme_desc": { bn: "ডার্ক ফরেস্ট বা মিস্ট মোড", en: "Dark Forest or Mist Mode" },
            "modal_lang": { bn: "ভাষা (Language)", en: "Language" },
            "modal_lang_desc": { bn: "বাংলা অথবা English", en: "Bangla or English" },
            "modal_done": { bn: "সম্পন্ন", en: "Done" },
            "status_uploading": { bn: "ছবি আপলোড হচ্ছে...", en: "Uploading Photo..." },
            "status_saving": { bn: "ডেটাবেস আপডেট হচ্ছে...", en: "Updating Database..." },
            "status_success": { bn: "প্রোফাইল সফলভাবে আপডেট হয়েছে!", en: "Profile updated successfully!" }
        };

        const langToggle = document.getElementById('lang-toggle');
        let currentLang = localStorage.getItem('lang') || 'bn';

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[key] && translations[key][lang]) {
                    if (el.tagName === 'INPUT' && el.type === 'button') el.value = translations[key][lang];
                    else el.innerHTML = translations[key][lang];
                }
            });
        }

        langToggle.addEventListener('change', function() {
            currentLang = this.checked ? 'en' : 'bn';
            localStorage.setItem('lang', currentLang);
            applyTranslations(currentLang);
            if (currentUserUid) {
                db.collection("users").doc(currentUserUid).update({ lang: currentLang }).catch(console.error);
            }
        });

        const htmlRoot = document.documentElement;
        const bodyContent = document.getElementById('body-content');
        const themeToggle = document.getElementById('theme-toggle');
        
        const bgDarkImg = document.getElementById('bg-dark-img');
        const bgDarkOverlay = document.getElementById('bg-dark-overlay');
        const bgLightImg = document.getElementById('bg-light-img');
        const bgLightOverlay = document.getElementById('bg-light-overlay');

        function enableLightMode() {
            htmlRoot.classList.add('light'); 
            bodyContent.classList.add('light-mode'); 
            bgDarkImg.classList.replace('opacity-20', 'opacity-0');
            bgDarkOverlay.classList.replace('opacity-100', 'opacity-0');
            bgLightImg.classList.replace('opacity-0', 'opacity-30');
            bgLightOverlay.classList.replace('opacity-0', 'opacity-100');
        }

        function enableDarkMode() {
            htmlRoot.classList.remove('light');
            bodyContent.classList.remove('light-mode');
            bgLightImg.classList.replace('opacity-30', 'opacity-0');
            bgLightOverlay.classList.replace('opacity-100', 'opacity-0');
            bgDarkImg.classList.replace('opacity-0', 'opacity-20');
            bgDarkOverlay.classList.replace('opacity-0', 'opacity-100');
        }

        themeToggle.addEventListener('change', function() {
            const newTheme = this.checked ? 'light' : 'dark';
            if (this.checked) enableLightMode(); else enableDarkMode();
            localStorage.setItem('theme', newTheme);
            if (currentUserUid) {
                db.collection("users").doc(currentUserUid).update({ theme: newTheme }).catch(console.error);
            }
        });

        const settingsModal = document.getElementById('settings-modal');
        const settingsContent = document.getElementById('settings-content');

        function openSettingsModal() {
            settingsModal.classList.remove('hidden');
            setTimeout(() => { settingsContent.classList.remove('scale-95'); settingsContent.classList.add('scale-100'); }, 10);
        }

        function closeSettingsModal() {
            settingsContent.classList.remove('scale-100');
            settingsContent.classList.add('scale-95');
            setTimeout(() => { settingsModal.classList.add('hidden'); }, 300);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDX3usovY7xlO4wY8GfJ3bk6pnRClGf1Ag",
            authDomain: "cuet-as.firebaseapp.com",
            projectId: "cuet-as",
            storageBucket: "cuet-as.firebasestorage.app",
            messagingSenderId: "869959746091",
            appId: "1:869959746091:web:fa2c086441fc429a14606e",
            measurementId: "G-WNJBJT9K5K"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUserUid = null;
        let existingPhotoURL = '';

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserUid = user.uid;
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        document.getElementById('fullName').value = data.fullName || '';
                        document.getElementById('studentId').value = data.studentId || '';
                        document.getElementById('email').value = data.email || '';
                        document.getElementById('hall').value = data.hall || 'Muktijoddha Hall';
                        document.getElementById('bloodGroup').value = data.bloodGroup || 'A+';
                        document.getElementById('phone').value = data.phone || '';
                        document.getElementById('emergencyContact').value = data.emergencyContact || '';
                        document.getElementById('tshirtSize').value = data.tshirtSize || 'M';
                        
                        existingPhotoURL = data.photoURL || '';
                        const avatarUrl = existingPhotoURL ? existingPhotoURL : `https://ui-avatars.com/api/?name=${encodeURIComponent(data.fullName || "User")}&background=e76f51&color=fff&size=256&bold=true`;
                        document.getElementById('preview-img').src = avatarUrl;

                        if(data.theme) {
                            localStorage.setItem('theme', data.theme);
                            if(data.theme === 'light') { enableLightMode(); themeToggle.checked = true; }
                            else { enableDarkMode(); themeToggle.checked = false; }
                        } else {
                            const localTheme = localStorage.getItem('theme');
                            if (localTheme === 'light') { enableLightMode(); themeToggle.checked = true; }
                        }

                        if(data.lang) {
                            localStorage.setItem('lang', data.lang);
                            currentLang = data.lang;
                            langToggle.checked = (data.lang === 'en');
                            applyTranslations(currentLang);
                        } else {
                            langToggle.checked = (currentLang === 'en');
                            applyTranslations(currentLang);
                        }
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        const profilePicInput = document.getElementById('profilePic');
        let selectedFile = null;

        profilePicInput.addEventListener('change', function(e) {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = function(event) { document.getElementById('preview-img').src = event.target.result; }
                reader.readAsDataURL(selectedFile);
            }
        });

        // Helper function to convert file to Base64
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        document.getElementById('edit-profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            const submitText = document.getElementById('submit-text');
            const submitIcon = document.getElementById('submit-icon');
            
            submitIcon.className = 'fa-solid fa-circle-notch fa-spin';
            submitText.innerText = currentLang === 'en' ? "Saving..." : "সেভ হচ্ছে...";
            submitBtn.disabled = true;

            try {
                let newPhotoURL = existingPhotoURL;

                if (selectedFile) {
                    submitText.innerText = translations["status_uploading"][currentLang];
                    
                    // NEW SECURE BACKEND CALL
                    const base64Image = await toBase64(selectedFile);
                    
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ imageBase64: base64Image })
                    });
                    
                    const imgbbData = await response.json();
                    
                    if (imgbbData.success) {
                        newPhotoURL = imgbbData.data.url;
                    } else {
                        throw new Error("API Upload Failed!");
                    }
                }

                submitText.innerText = translations["status_saving"][currentLang];

                await db.collection("users").doc(currentUserUid).update({
                    fullName: document.getElementById('fullName').value,
                    studentId: document.getElementById('studentId').value,
                    hall: document.getElementById('hall').value,
                    bloodGroup: document.getElementById('bloodGroup').value,
                    phone: document.getElementById('phone').value,
                    emergencyContact: document.getElementById('emergencyContact').value,
                    tshirtSize: document.getElementById('tshirtSize').value,
                    photoURL: newPhotoURL
                });

                alert(translations["status_success"][currentLang]);
                window.location.href = "dashboard.html";

            } catch (error) {
                alert("Error: " + error.message);
                submitIcon.className = 'fa-solid fa-cloud-arrow-up';
                submitText.innerText = translations["btn_save"][currentLang];
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
