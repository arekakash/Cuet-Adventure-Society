<!DOCTYPE html>
<html lang="bn" class="scroll-smooth" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Story - CUET AS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    colors: {
                        darkForest: '#050b08',
                        moss: '#0a1c13',
                        trail: '#2d6a4f',
                        campfire: '#e76f51', 
                        facebook: '#0866FF',
                        mistBg: '#e2e8f0', 
                        mistPanel: '#f8fafc',
                    }
                }
            },
            plugins: [
                tailwind.plugin(function({ addVariant }) {
                    addVariant('light-mode', '.light-mode &');
                })
            ]
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--scroll-bg, #050b08); }
        ::-webkit-scrollbar-thumb { background: #2d6a4f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e76f51; }
        
        .glass-dark {
            background: rgba(10, 28, 19, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .light-mode .glass-dark {
            background: rgba(248, 250, 252, 0.85);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* Blog Content Typography */
        #story-content p { margin-bottom: 1.5rem; line-height: 1.8; color: #d1d5db; font-size: 1.125rem; }
        .light-mode #story-content p { color: #334155; }
        
        #story-content img { border-radius: 1rem; margin: 2rem auto; max-width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .light-mode #story-content img { box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        #story-content h2, #story-content h3 { color: #ffffff; font-weight: 900; margin-top: 2rem; margin-bottom: 1rem; }
        .light-mode #story-content h2, .light-mode #story-content h3 { color: #0f172a; }
        
        #story-content h2 { font-size: 1.875rem; }
        #story-content h3 { font-size: 1.5rem; }
        
        #story-content a { color: #e76f51; text-decoration: underline; }

        .toggle-checkbox:checked { right: 0; border-color: #e76f51; }
        .toggle-checkbox:checked + .toggle-label { background-color: #e76f51; }
    </style>
</head>

<body class="bg-darkForest text-gray-300 dark:bg-darkForest font-sans antialiased selection:bg-campfire selection:text-white overflow-x-hidden relative transition-colors duration-500" id="body-content">

    <div class="fixed inset-0 z-0 pointer-events-none transition-opacity duration-1000">
        <img id="bg-dark-img" src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&q=80&w=1920" class="absolute w-full h-full object-cover opacity-20 filter brightness-75 contrast-125 transition-opacity duration-1000">
        <div id="bg-dark-overlay" class="absolute inset-0 bg-gradient-to-b from-darkForest via-darkForest/90 to-moss/95 transition-opacity duration-1000"></div>

        <img id="bg-light-img" src="https://images.unsplash.com/photo-1482938289607-e9573fc25ebb?auto=format&fit=crop&q=80&w=1920" class="absolute w-full h-full object-cover opacity-0 filter transition-opacity duration-1000">
        <div id="bg-light-overlay" class="absolute inset-0 bg-gradient-to-b from-white/90 via-white/95 to-mistBg/95 opacity-0 transition-opacity duration-1000"></div>
    </div>

    <nav class="fixed w-full z-40 glass-dark transition-all duration-300 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex justify-between items-center">
            <a href="stories.html" class="inline-flex items-center gap-2 text-gray-300 light-mode:text-gray-700 hover:text-campfire transition-colors font-bold text-sm bg-white/5 light-mode:bg-white/50 px-4 py-2 rounded-full border border-white/10 light-mode:border-gray-300">
                <i class="fa-solid fa-arrow-left"></i> <span data-i18n="back_stories">গল্পের পাতায় ফিরুন</span>
            </a>
            <div class="flex items-center gap-4">
                <button onclick="openSettingsModal()" class="text-gray-400 light-mode:text-gray-600 hover:text-blue-400 transition-colors bg-white/5 light-mode:bg-white/50 w-10 h-10 rounded-full flex items-center justify-center border border-white/10 light-mode:border-gray-300">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>
    </nav>

    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity" onclick="closeSettingsModal()"></div>
        <div class="bg-moss light-mode:bg-white border border-white/10 light-mode:border-gray-200 rounded-3xl p-8 max-w-sm w-full mx-4 relative z-10 shadow-2xl transform scale-95 transition-transform duration-300" id="settings-content">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 light-mode:border-gray-200 pb-4">
                <h3 class="text-xl font-black text-white light-mode:text-black flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-campfire"></i> <span data-i18n="modal_settings">সেটিংস</span>
                </h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-white light-mode:hover:text-black transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="font-bold text-white light-mode:text-black text-sm" data-i18n="modal_theme">থিম</p>
                        <p class="text-xs text-gray-500">ডার্ক বা মিস্ট মোড</p>
                    </div>
                    <div class="relative inline-block w-12 mr-2 align-middle select-none">
                        <input type="checkbox" id="theme-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform"/>
                        <label for="theme-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"></label>
                    </div>
                </div>
                <div class="flex items-center justify-between">
                    <div>
                        <p class="font-bold text-white light-mode:text-black text-sm" data-i18n="modal_lang">ভাষা</p>
                        <p class="text-xs text-gray-500">বাংলা / English</p>
                    </div>
                    <div class="relative inline-block w-12 mr-2 align-middle select-none">
                        <input type="checkbox" id="lang-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform"/>
                        <label for="lang-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-blue-500 cursor-pointer"></label>
                    </div>
                </div>
            </div>
            <div class="mt-8">
                <button onclick="closeSettingsModal()" class="w-full bg-white/5 light-mode:bg-gray-100 hover:bg-white/10 text-white light-mode:text-black font-bold py-3 rounded-xl transition-all" data-i18n="modal_done">সম্পন্ন</button>
            </div>
        </div>
    </div>

    <main class="relative z-10 pt-24 pb-20 min-h-screen max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div id="loader" class="flex flex-col items-center justify-center py-32">
            <i class="fa-solid fa-compass text-5xl text-campfire animate-spin mb-4 shadow-[0_0_15px_rgba(231,111,81,0.5)] rounded-full"></i>
            <p class="text-gray-400 font-bold tracking-widest animate-pulse" data-i18n="loading">ডেটাবেস থেকে গল্প আনা হচ্ছে...</p>
        </div>

        <div id="error-state" class="hidden flex-col items-center justify-center py-32 text-center">
            <i class="fa-solid fa-triangle-exclamation text-6xl text-red-500 mb-6"></i>
            <h2 class="text-2xl font-black text-white light-mode:text-black mb-2" data-i18n="err_title">গল্পটি পাওয়া যায়নি!</h2>
            <p class="text-gray-400 light-mode:text-gray-600 mb-6" data-i18n="err_desc">লিংকটি হয়তো ভুল অথবা অ্যাডমিন গল্পটি মুছে ফেলেছেন।</p>
            <a href="stories.html" class="bg-trail text-white px-6 py-3 rounded-xl font-bold hover:bg-mountain transition-colors">ফিরে যান</a>
        </div>

        <article id="story-article" class="hidden opacity-0 transition-opacity duration-1000">
            
            <div class="w-full h-64 sm:h-96 rounded-[2rem] overflow-hidden mb-10 relative shadow-2xl border border-white/10 light-mode:border-gray-200" data-aos="zoom-in">
                <img id="display-cover" src="" class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-700" alt="Cover Image">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                
                <div class="absolute bottom-6 left-6 right-6">
                    <div class="flex items-center gap-3 text-xs sm:text-sm text-gray-300 font-bold mb-3 tracking-widest uppercase">
                        <span id="display-date" class="bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/10">...</span>
                        <span class="bg-campfire/80 text-white backdrop-blur-md px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-[0_0_10px_rgba(231,111,81,0.5)]">
                            <i class="fa-solid fa-clock"></i> <span id="display-readtime">...</span> <span data-i18n="min_read">মিনিট পাঠ</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="mb-12 border-b border-white/10 light-mode:border-gray-300 pb-10" data-aos="fade-up" data-aos-delay="100">
                <h1 id="display-title" class="text-3xl sm:text-5xl md:text-6xl font-black text-white light-mode:text-black mb-8 leading-tight tracking-tight">...</h1>
                
                <div class="flex items-center justify-between bg-white/5 light-mode:bg-white/60 p-4 sm:p-5 rounded-2xl border border-white/5 light-mode:border-gray-200 backdrop-blur-md">
                    <div class="flex items-center gap-4">
                        <img id="display-author-img" src="" class="w-14 h-14 rounded-full border-2 border-trail object-cover shadow-[0_0_10px_rgba(45,106,79,0.3)]">
                        <div>
                            <p class="text-xs text-gray-400 light-mode:text-gray-500 uppercase tracking-widest font-bold mb-0.5" data-i18n="author_label">লেখক</p>
                            <p id="display-author-name" class="text-lg font-black text-gray-200 light-mode:text-gray-900 leading-none mb-1">...</p>
                            <p id="display-author-dept" class="text-xs text-trail font-bold">...</p>
                        </div>
                    </div>
                    
                    <a id="display-fb-link" href="#" target="_blank" class="hidden w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-facebook/10 text-facebook flex items-center justify-center hover:bg-facebook hover:text-white transition-all shadow-[0_0_15px_rgba(8,102,255,0.2)]">
                        <i class="fa-brands fa-facebook-f text-lg sm:text-xl"></i>
                    </a>
                </div>
            </div>

            <div id="story-content" class="w-full" data-aos="fade-up" data-aos-delay="200">
                </div>

            <div class="mt-20 pt-8 border-t border-white/10 light-mode:border-gray-300 flex justify-center pb-20">
                <a href="stories.html" class="inline-flex items-center gap-2 text-gray-400 light-mode:text-gray-600 hover:text-white light-mode:hover:text-black transition-colors font-bold border border-white/10 light-mode:border-gray-300 bg-white/5 light-mode:bg-white/50 px-6 py-3 rounded-xl hover:-translate-y-1">
                    <i class="fa-solid fa-layer-group"></i> <span data-i18n="read_more">আরও গল্প পড়ুন</span>
                </a>
            </div>

        </article>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script> AOS.init({ once: true, offset: 50 }); </script>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <script>
        // Dictionary
        const translations = {
            "back_stories": { bn: "গল্পের পাতায় ফিরুন", en: "Back to Stories" },
            "modal_settings": { bn: "সেটিংস", en: "Settings" },
            "modal_theme": { bn: "থিম", en: "Theme" },
            "modal_lang": { bn: "ভাষা", en: "Language" },
            "modal_done": { bn: "সম্পন্ন", en: "Done" },
            "loading": { bn: "ডেটাবেস থেকে গল্প আনা হচ্ছে...", en: "Fetching story from database..." },
            "err_title": { bn: "গল্পটি পাওয়া যায়নি!", en: "Story not found!" },
            "err_desc": { bn: "লিংকটি হয়তো ভুল অথবা অ্যাডমিন গল্পটি মুছে ফেলেছেন।", en: "The link might be wrong or the admin deleted it." },
            "author_label": { bn: "লেখক", en: "Author" },
            "min_read": { bn: "মিনিট পাঠ", en: "Min Read" },
            "read_more": { bn: "আরও গল্প পড়ুন", en: "Read More Stories" }
        };

        const langToggle = document.getElementById('lang-toggle');
        let currentLang = localStorage.getItem('lang') || 'bn';
        if(currentLang === 'en') langToggle.checked = true;

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[key] && translations[key][lang]) el.innerHTML = translations[key][lang];
            });
        }
        langToggle.addEventListener('change', function() {
            currentLang = this.checked ? 'en' : 'bn';
            localStorage.setItem('lang', currentLang);
            applyTranslations(currentLang);
        });

        // Theme Engine
        const htmlRoot = document.documentElement;
        const bodyContent = document.getElementById('body-content');
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');
        
        if (currentTheme === 'light') { enableLightMode(); themeToggle.checked = true; }
        
        themeToggle.addEventListener('change', function() {
            if (this.checked) { enableLightMode(); localStorage.setItem('theme', 'light'); } 
            else { enableDarkMode(); localStorage.setItem('theme', 'dark'); }
        });

        function enableLightMode() {
            htmlRoot.classList.add('light'); bodyContent.classList.add('light-mode'); 
            document.getElementById('bg-dark-img').classList.replace('opacity-20', 'opacity-0');
            document.getElementById('bg-dark-overlay').classList.replace('opacity-100', 'opacity-0');
            document.getElementById('bg-light-img').classList.replace('opacity-0', 'opacity-40');
            document.getElementById('bg-light-overlay').classList.replace('opacity-0', 'opacity-100');
        }
        function enableDarkMode() {
            htmlRoot.classList.remove('light'); bodyContent.classList.remove('light-mode');
            document.getElementById('bg-light-img').classList.replace('opacity-40', 'opacity-0');
            document.getElementById('bg-light-overlay').classList.replace('opacity-100', 'opacity-0');
            document.getElementById('bg-dark-img').classList.replace('opacity-0', 'opacity-20');
            document.getElementById('bg-dark-overlay').classList.replace('opacity-0', 'opacity-100');
        }

        // Modal Logic
        const settingsModal = document.getElementById('settings-modal');
        const settingsContent = document.getElementById('settings-content');
        function openSettingsModal() { settingsModal.classList.remove('hidden'); setTimeout(() => { settingsContent.classList.remove('scale-95'); settingsContent.classList.add('scale-100'); }, 10); }
        function closeSettingsModal() { settingsContent.classList.remove('scale-100'); settingsContent.classList.add('scale-95'); setTimeout(() => { settingsModal.classList.add('hidden'); }, 300); }

        // ==========================================
        // FIREBASE FETCH DATA LOGIC
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDX3usovY7xlO4wY8GfJ3bk6pnRClGf1Ag",
            authDomain: "cuet-as.firebaseapp.com",
            projectId: "cuet-as"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('id');

        const loader = document.getElementById('loader');
        const errorState = document.getElementById('error-state');
        const articleArea = document.getElementById('story-article');

        if (!storyId) {
            loader.classList.add('hidden');
            errorState.classList.remove('hidden');
            errorState.classList.add('flex');
            applyTranslations(currentLang);
        } else {
            db.collection("stories").doc(storyId).get().then((doc) => {
                loader.classList.add('hidden');
                
                if (doc.exists) {
                    const data = doc.data();
                    
                    // Only show if approved
                    if(data.status !== "approved") {
                        errorState.classList.remove('hidden');
                        errorState.classList.add('flex');
                        return;
                    }

                    // Populate UI
                    document.getElementById('display-title').innerText = data.title;
                    document.getElementById('display-cover').src = data.coverPhoto || 'https://images.unsplash.com/photo-1517824806704-9040b037703b?auto=format&fit=crop&q=80&w=1920';
                    document.getElementById('display-author-name').innerText = data.authorName;
                    document.getElementById('display-author-dept').innerText = data.authorBatch || 'Explorer';
                    document.getElementById('display-readtime').innerText = data.readTime || 5;
                    
                    document.getElementById('display-author-img').src = data.authorPhoto || `https://ui-avatars.com/api/?name=${encodeURIComponent(data.authorName)}&background=0a1c13&color=fff`;

                    if(data.createdAt) {
                        const date = data.createdAt.toDate();
                        const options = { year: 'numeric', month: 'long', day: 'numeric' };
                        document.getElementById('display-date').innerText = date.toLocaleDateString(currentLang === 'en' ? 'en-US' : 'bn-BD', options);
                    }

                    // Optional FB Link
                    if(data.authorFb) {
                        const fbLink = document.getElementById('display-fb-link');
                        fbLink.href = data.authorFb;
                        fbLink.classList.remove('hidden');
                    }

                    // Inject Rich Text (HTML)
                    document.getElementById('story-content').innerHTML = data.content;

                    // Show Article
                    articleArea.classList.remove('hidden');
                    setTimeout(() => { articleArea.classList.remove('opacity-0'); }, 50);

                } else {
                    errorState.classList.remove('hidden');
                    errorState.classList.add('flex');
                }
                applyTranslations(currentLang);
            }).catch((error) => {
                console.error("Error fetching document:", error);
                loader.classList.add('hidden');
                errorState.classList.remove('hidden');
                errorState.classList.add('flex');
                applyTranslations(currentLang);
            });
        }
    </script>
</body>
</html>
