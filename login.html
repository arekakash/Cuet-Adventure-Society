<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - CUET AS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkForest: '#050b08',
                        moss: '#0a1c13',
                        trail: '#2d6a4f',
                        campfire: '#e76f51',
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(231, 111, 81, 0.4)',
                        'glow-sm': '0 0 10px rgba(231, 111, 81, 0.2)',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050b08; }
        ::-webkit-scrollbar-thumb { background: #2d6a4f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e76f51; }

        /* Dark Glass Input Styles */
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3f4f6;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }
        .glass-input:focus {
            background: rgba(10, 28, 19, 0.8);
            border-color: #e76f51;
            box-shadow: 0 0 15px rgba(231, 111, 81, 0.3);
            transform: translateY(-3px) scale(1.01);
        }

        .glass-panel {
            background: rgba(10, 28, 19, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0a1c13 inset !important;
            -webkit-text-fill-color: white !important;
        }
    </style>
</head>

<body class="bg-darkForest text-gray-300 font-sans antialiased min-h-screen flex md:items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-x-hidden selection:bg-campfire selection:text-white">

    <!-- Thematic Background -->
    <div class="absolute inset-0 z-0 pointer-events-none">
        <img src="https://images.unsplash.com/photo-1517824806704-9040b037703b?auto=format&fit=crop&q=80&w=1920" alt="Dark Forest Path" class="w-full h-full object-cover opacity-20 filter brightness-50 contrast-125">
        <div class="absolute inset-0 bg-gradient-to-br from-darkForest/90 via-moss/80 to-darkForest/90"></div>
        
        <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-campfire/10 rounded-full mix-blend-screen filter blur-[100px] animate-[pulse_5s_ease-in-out_infinite]"></div>
        <div class="absolute bottom-1/4 left-1/4 w-80 h-80 bg-trail/10 rounded-full mix-blend-screen filter blur-[80px] animate-[pulse_7s_ease-in-out_infinite]"></div>
    </div>

    <!-- Main Container -->
    <div class="max-w-5xl w-full glass-panel rounded-[2rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative z-10 border border-white/10" data-aos="zoom-in" data-aos-duration="1000">
        
        <!-- Left Side: Hero / Vibe -->
        <div class="w-full md:w-5/12 bg-black/40 text-white flex flex-col justify-between relative overflow-hidden group p-10 lg:p-14">
            
            <!-- WATERMARK LOGO BACKGROUND (Abcha) -->
            <div class="absolute -bottom-20 -left-20 w-[150%] opacity-[0.07] pointer-events-none transform -rotate-12 mix-blend-screen">
                <img src="https://i.ibb.co.com/RTsXRhrL/FB-IMG-1788798212734.jpg" alt="Watermark">
            </div>

            <div class="relative z-10 flex flex-col h-full justify-between">
                <div data-aos="fade-right" data-aos-delay="200">
                    <a href="index.html" class="inline-flex items-center gap-2 text-gray-400 mb-12 hover:text-campfire transition-colors backdrop-blur-sm bg-white/5 px-4 py-2 rounded-full text-xs font-bold tracking-widest uppercase border border-white/10 hover:border-campfire/50 hover:bg-campfire/10">
                        <i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরে যান
                    </a>
                    
                    <!-- Floatiing Logo -->
                    <div class="mb-8 animate-float">
                        <img src="https://i.ibb.co.com/RTsXRhrL/FB-IMG-1788798212734.jpg" alt="CUET AS Logo" class="h-24 sm:h-28 w-auto object-contain mix-blend-screen drop-shadow-2xl">
                    </div>
                    
                    <h2 class="text-4xl lg:text-5xl font-black leading-tight mb-5 tracking-tight text-white drop-shadow-lg">
                        ফিরে আসার <br><span class="text-campfire">রোমাঞ্চ</span>
                    </h2>
                    <p class="text-gray-400 text-sm sm:text-base leading-relaxed border-l-2 border-campfire pl-4">
                        আপনার পরবর্তী অ্যাডভেঞ্চার অপেক্ষা করছে। ক্লাবের ইভেন্ট বুকিং ও ড্যাশবোর্ড অ্যাক্সেস করতে লগইন করুন।
                    </p>
                </div>
            </div>
        </div>

        <!-- Right Side: The Login Form -->
        <div class="w-full md:w-7/12 p-8 sm:p-12 lg:p-16 relative flex flex-col justify-center overflow-hidden">
            
            <!-- LOGO WATERMARK BEHIND FORM -->
            <div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none z-0">
                <img src="https://i.ibb.co.com/RTsXRhrL/FB-IMG-1788798212734.jpg" alt="Form Watermark" class="w-2/3 sm:w-1/2 object-contain mix-blend-screen grayscale">
            </div>

            <div class="relative z-10">
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5 mb-10 text-center sm:text-left" data-aos="fade-down" data-aos-delay="300">
                    <div class="p-4 bg-white/5 rounded-2xl border border-white/10 shadow-sm backdrop-blur-md text-campfire text-3xl">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <div class="mt-1">
                        <h3 class="text-2xl lg:text-3xl font-black text-white mb-1 tracking-tight">ড্যাশবোর্ডে লগইন করুন</h3>
                        <p class="text-sm text-gray-400 font-medium">নিরাপদে আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
                    </div>
                </div>

                <!-- Google Login -->
                <div data-aos="fade-up" data-aos-delay="400">
                    <button id="google-login-btn" type="button" class="w-full flex items-center justify-center gap-3 bg-white/5 border border-white/10 text-gray-200 hover:bg-white/10 hover:border-campfire/50 hover:shadow-glow-sm font-bold py-3.5 px-4 rounded-xl transition-all mb-6 relative overflow-hidden group backdrop-blur-sm">
                        <svg class="w-5 h-5 relative z-10" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.58c2.08-1.92 3.27-4.74 3.27-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.58-2.77c-.98.66-2.23 1.06-3.7 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span class="relative z-10">গুগল দিয়ে কন্টিনিউ করুন</span>
                    </button>
                </div>

                <div class="relative flex items-center py-2 mb-6" data-aos="fade-up" data-aos-delay="450">
                    <div class="flex-grow border-t border-white/10"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-500 text-[10px] sm:text-xs font-bold tracking-widest uppercase bg-transparent px-2">অথবা ইমেইল দিয়ে</span>
                    <div class="flex-grow border-t border-white/10"></div>
                </div>

                <!-- Manual Login Form -->
                <form id="login-form" class="space-y-5">
                    
                    <div data-aos="fade-up" data-aos-delay="500">
                        <label class="block text-[11px] font-bold text-gray-400 mb-1.5 uppercase tracking-wider">ইমেইল অ্যাড্রেস</label>
                        <input type="email" id="email" required placeholder="example@cuet.ac.bd" class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none transition-opacity">
                    </div>

                    <div data-aos="fade-up" data-aos-delay="550">
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">পাসওয়ার্ড</label>
                            <a href="#" class="text-[10px] text-campfire hover:text-white transition-colors font-medium">পাসওয়ার্ড ভুলে গেছেন?</a>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••" class="glass-input w-full text-sm rounded-xl block p-3.5 outline-none">
                    </div>

                    <div class="pt-6" data-aos="zoom-in" data-aos-delay="650">
                        <button type="submit" id="submit-btn" class="w-full bg-campfire hover:bg-orange-600 text-white font-black text-lg py-4 px-4 rounded-xl transition-all shadow-glow hover:shadow-[0_0_30px_rgba(231,111,81,0.6)] hover:-translate-y-1 flex justify-center items-center gap-2">
                            <i class="fa-solid fa-right-to-bracket"></i> <span>লগইন করুন</span>
                        </button>
                    </div>
                </form>

                <!-- Sign Up Link -->
                <div class="mt-8 text-center" data-aos="fade-up" data-aos-delay="700">
                    <p class="text-sm text-gray-400">
                        অ্যাকাউন্ট নেই? 
                        <a href="signup.html" class="text-campfire font-bold hover:text-white transition-colors border-b border-transparent hover:border-white pb-0.5">নতুন অ্যাডভেঞ্চার অ্যাকাউন্ট তৈরি করুন</a>
                    </p>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script> AOS.init({ once: true, offset: 50 }); </script>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDX3usovY7xlO4wY8GfJ3bk6pnRClGf1Ag",
            authDomain: "cuet-as.firebaseapp.com",
            projectId: "cuet-as",
            storageBucket: "cuet-as.firebasestorage.app",
            messagingSenderId: "869959746091",
            appId: "1:869959746091:web:fa2c086441fc429a14606e",
            measurementId: "G-WNJBJT9K5K"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        const googleBtn = document.getElementById('google-login-btn');
        const provider = new firebase.auth.GoogleAuthProvider();

        googleBtn.addEventListener('click', () => {
            googleBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Checking Data...';
            
            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    db.collection("users").doc(user.uid).get().then((doc) => {
                        if (doc.exists) {
                            window.location.href = "dashboard.html";
                        } else {
                            alert("আপনার প্রোফাইল অসম্পূর্ণ! দয়া করে সাইন-আপ পেজ থেকে তথ্যগুলো পূরণ করুন।");
                            window.location.href = "signup.html";
                        }
                    }).catch((err) => {
                        console.error(err);
                        googleBtn.innerHTML = 'গুগল দিয়ে কন্টিনিউ করুন';
                    });
                })
                .catch((error) => {
                    alert("লগইন করা যায়নি: " + error.message);
                    googleBtn.innerHTML = 'গুগল দিয়ে কন্টিনিউ করুন';
                });
        });

        const loginForm = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> লগইন হচ্ছে...';
            submitBtn.disabled = true;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("ইমেইল অথবা পাসওয়ার্ড ভুল হয়েছে! আবার চেষ্টা করুন।");
                    submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> <span>লগইন করুন</span>';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
